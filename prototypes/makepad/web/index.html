<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知音 · Makepad 原型</title>
<style>
html,body{margin:0;background:#17201e;color:#d8ebe1;font-family:system-ui;height:100%;overflow:hidden}
canvas{width:100%;height:100%;outline:none}#boot{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
</style>
<!-- Honor Retina/zoom DPR; Makepad otherwise caps desktop rendering at 1.5x
     and 2 MiPixels. The 16 MiPixel budget fits a 5K display while retaining
     upstream allocation/hardware limits. maxdpr is a ceiling, not supersampling. -->
<canvas id="app" fullpage="true" maxdpr="8" renderpixelbudget="16777216" tabindex="0" aria-label="知音语音转写应用"></canvas>
<div id="boot">正在打开知音…</div>
<input id="audio-file" type="file" accept="audio/wav,.wav" hidden>
<script type="module" src="./app.js"></script>
</html>
