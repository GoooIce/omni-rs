[package]
name = "r2t2-makepad"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
makepad-widgets = { git = "https://github.com/makepad/makepad", rev = "711521dbfaba2d04be4d88176deef367f33d9ed3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
omni-r2t2 = { path = "../..", default-features = false, features = ["native", "metal", "ane"] }
burn = { version = "=0.21.0", default-features = false, features = ["std", "fusion", "ane"] }
hound = "3.5"
pollster = "0.4"
cpal = "0.16"
omni-breeze-tts = { path = "../../crates/breeze-tts", default-features = false, features = ["metal", "ane"] }
omni-qwen-image = { path = "../../crates/qwen-image", default-features = false, features = ["metal"] }
omni-hy-mt = { path = "../../crates/hy-mt", default-features = false, features = ["native", "metal"] }
omni-music = { path = "../../crates/omni-music", default-features = false, features = ["metal"] }
omni-minicpm-v = { path = "../../crates/minicpm-v", default-features = false, features = ["metal"] }
omni-lfm3 = { path = "../../crates/lfm3-omni", default-features = false, features = ["metal"] }
burn-cubecl = { version = "=0.21.0", default-features = false, features = ["std"] }
cubecl = { version = "=0.10.0", default-features = false, features = ["std", "wgpu"] }
burn-ane = { path = "../../crates/burn-ane", version = "=0.21.0", default-features = false, features = ["metal-shared"] }
