[workspace]
resolver = "3"
members = [
    ".",
    "crates/breeze-tts",
    "crates/burn-ane",
    "crates/hy-mt",
    "crates/lfm3-omni",
    "crates/minicpm-v",
    "crates/mtl4",
    "crates/omni-api",
    "crates/omni-kernel",
    "crates/omni-music",
    "crates/omni-rsi",
    "crates/qwen-image",
    "crates/resin-metal",
    "prototypes/int8-gemm",
    "prototypes/makepad",
    "prototypes/tts-gemv",
]
default-members = ["."]

[package]
name = "omni-r2t2"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Confucius4-R2T2 streaming speech recognition with Burn, Metal and WebGPU"
license = "Apache-2.0"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "r2t2"
path = "src/bin/r2t2.rs"
required-features = ["native"]

[[example]]
name = "verify_reference"
required-features = ["native"]

[[example]]
name = "asr-cache-bench"
required-features = ["native", "metal"]

[[example]]
name = "asr-batch-bench"
required-features = ["native", "metal"]

[[example]]
name = "verify_coreml"
required-features = ["coreml", "metal"]

[[example]]
name = "ane_backend"
required-features = ["ane"]

[[example]]
name = "ane_metal"
required-features = ["ane", "metal"]

[[example]]
name = "ane_blocks"
required-features = ["ane", "metal"]

[[example]]
name = "stream_eval"
required-features = ["ane", "metal"]

[[example]]
name = "stream_soak"
required-features = ["ane", "metal", "microphone"]

[features]
default = ["native", "metal"]
native = ["dep:clap", "dep:hound", "dep:memmap2", "dep:pollster"]
wgpu = ["burn/wgpu", "burn/fusion", "burn/autotune", "omni-kernel/wgpu"]
metal = ["wgpu", "burn/metal", "omni-kernel/metal"]
cpu = ["burn/ndarray"]
microphone = ["native", "dep:cpal", "dep:ctrlc"]
coreml = ["native", "dep:sha2"]
ane = ["native", "burn/ane", "burn/ndarray", "omni-kernel?/ane"]

[dependencies]
burn = { version = "=0.21.0", default-features = false, features = ["std"] }
omni-kernel = { path = "crates/omni-kernel", default-features = false, optional = true }
half = "2.7"
safetensors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = { version = "0.10", features = ["asm"], optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
clap = { version = "4.5", features = ["derive"], optional = true }
hound = { version = "3.5", optional = true }
memmap2 = { version = "0.9", optional = true }
pollster = { version = "0.4", optional = true }
cpal = { version = "0.16", optional = true }
ctrlc = { version = "3.4", optional = true }

[dev-dependencies]
burn = { version = "=0.21.0", default-features = false, features = ["std", "ndarray"] }
pollster = "0.4"

[patch.crates-io]
cubek-matmul = { path = "vendor/cubek-matmul" }
burn-cubecl = { path = "vendor/burn-cubecl" }
cubecl-common = { path = "vendor/cubecl-common" }
cubecl-cpp = { path = "vendor/cubecl-cpp" }
burn-fusion = { path = "vendor/burn-fusion" }
cubecl-runtime = { path = "vendor/cubecl-runtime" }
cubecl-wgpu = { path = "vendor/cubecl-wgpu" }
burn-router = { path = "vendor/burn-router" }
burn = { path = "vendor/burn" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "off"
incremental = false
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
debug = 0

[profile.debug-full]
inherits = "dev"
debug = 2
split-debuginfo = "packed"
incremental = true
