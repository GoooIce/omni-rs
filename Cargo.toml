[package]
name = "omni-r2t2"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Confucius4-R2T2 streaming speech recognition with Burn, Metal and WebGPU"
license = "Apache-2.0"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "r2t2"
path = "src/bin/r2t2.rs"
required-features = ["native"]

[[example]]
name = "verify_reference"
required-features = ["native"]

[[example]]
name = "asr-cache-bench"
required-features = ["native", "metal"]

[[example]]
name = "asr-batch-bench"
required-features = ["native", "metal"]

[[example]]
name = "verify_coreml"
required-features = ["coreml", "metal"]

[[example]]
name = "ane_backend"
required-features = ["ane"]

[[example]]
name = "ane_metal"
required-features = ["ane", "metal"]

[[example]]
name = "ane_blocks"
required-features = ["ane", "metal"]

[[example]]
name = "stream_eval"
required-features = ["ane", "metal"]

[[example]]
name = "stream_soak"
required-features = ["ane", "metal", "microphone"]

[features]
default = ["native", "metal"]
native = ["dep:clap", "dep:hound", "dep:memmap2", "dep:pollster"]
metal = ["burn/metal", "burn/fusion", "burn/autotune", "dep:omni-kernel"]
webgpu = ["burn/webgpu", "burn/fusion"]
cpu = ["burn/ndarray"]
microphone = ["native", "dep:cpal", "dep:ctrlc"]
coreml = ["native", "dep:sha2"]
ane = ["native", "burn/ane", "burn/ndarray", "omni-kernel?/ane"]
wasm = ["webgpu", "tokenizers/unstable_wasm", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:serde-wasm-bindgen", "dep:web-time"]

[dependencies]
burn = { version = "=0.21.0", default-features = false, features = ["std"] }
half = "2.7"
safetensors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = { version = "0.10", features = ["asm"], optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
clap = { version = "4.5", features = ["derive"], optional = true }
hound = { version = "3.5", optional = true }
memmap2 = { version = "0.9", optional = true }
pollster = { version = "0.4", optional = true }
cpal = { version = "0.16", optional = true }
ctrlc = { version = "3.4", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
web-time = { version = "1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
omni-kernel = { path = "crates/omni-kernel", optional = true }

[dev-dependencies]
burn = { version = "=0.21.0", default-features = false, features = ["std", "ndarray"] }
pollster = "0.4"

[patch.crates-io]
burn-cubecl = { path = "vendor/burn-cubecl" }
cubecl-common = { path = "vendor/cubecl-common" }
burn-fusion = { path = "vendor/burn-fusion" }
cubecl-runtime = { path = "vendor/cubecl-runtime" }
cubecl-wgpu = { path = "vendor/cubecl-wgpu" }
burn-router = { path = "vendor/burn-router" }
burn = { path = "vendor/burn" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
