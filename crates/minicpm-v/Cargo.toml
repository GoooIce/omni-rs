[package]
name = "omni-minicpm-v"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
description = "MiniCPM-V-4.7 local multimodal inference in Rust and Burn"

[workspace]

[features]
default = ["native", "metal"]
native = ["dep:clap", "dep:pollster", "dep:ctrlc"]
metal = ["burn/metal", "burn/autotune", "dep:burn-fusion", "dep:burn-cubecl", "dep:cubecl"]
cpu = ["burn/ndarray"]

[dependencies]
omni-r2t2 = { path = "../..", default-features = false, features = ["native"] }
burn = { version = "=0.21.0", default-features = false, features = ["std"] }
burn-fusion = { version = "=0.21.0", default-features = false, features = ["std"], optional = true }
burn-cubecl = { version = "=0.21.0", default-features = false, optional = true, features = ["std", "fusion"] }
cubecl = { version = "=0.10.0", default-features = false, features = ["std", "stdlib"], optional = true }
burn-tensor = { version = "=0.21.0", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
half = "2"
thiserror = "2"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
safetensors = "0.6"
clap = { version = "4.5", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }
ctrlc = { version = "3.4", optional = true }

[dev-dependencies]
burn = { version = "=0.21.0", default-features = false, features = ["std", "ndarray"] }
tempfile = "3"

[[bin]]
name = "minicpm-v"
path = "src/bin/minicpm-v.rs"
required-features = ["native"]

[[test]]
name = "greedy_parity"
required-features = ["cpu"]

[[test]]
name = "image_parity"
required-features = ["cpu"]

[patch.crates-io]
cubek-matmul = { path = "../../vendor/cubek-matmul" }
burn-cubecl = { path = "../../vendor/burn-cubecl" }
cubecl-common = { path = "../../vendor/cubecl-common" }
cubecl-cpp = { path = "../../vendor/cubecl-cpp" }
burn-fusion = { path = "../../vendor/burn-fusion" }
cubecl-runtime = { path = "../../vendor/cubecl-runtime" }
cubecl-wgpu = { path = "../../vendor/cubecl-wgpu" }
burn-router = { path = "../../vendor/burn-router" }
burn = { path = "../../vendor/burn" }

[profile.release]
lto = "thin"
codegen-units = 16

[profile.dev]
debug = "line-tables-only"
incremental = false
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.debug-full]
inherits = "dev"
debug = 2
incremental = true
