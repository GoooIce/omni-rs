[package]
name = "omni-hub"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Pure-Rust checkpoint catalog, downloader, route settings, and isolated credential store"
license = "Apache-2.0"

[dependencies]
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["asm"] }
thiserror = "2"
ureq = { version = "2.12", default-features = false, features = ["tls", "json", "gzip"] }
url = "2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
