[package]
autotests = false
name = "resin-metal"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
description = "Resin EngineCore serving stack driven from Rust with local model runners"

[features]
default = ["metal"]
wgpu = ["omni-minicpm-v/wgpu", "burn/wgpu", "burn/autotune"]
metal = ["wgpu", "omni-minicpm-v/metal", "burn/metal"]
cpu = ["omni-minicpm-v/cpu", "burn/ndarray"]

[dependencies]
resin-core = { path = "../../vendor/resin-core" }
omni-minicpm-v = { path = "../minicpm-v", default-features = false }
omni-r2t2 = { path = "../..", default-features = false, features = ["native"] }
burn = { version = "=0.21.0", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
burn = { version = "=0.21.0", default-features = false, features = ["std", "ndarray"] }

[[example]]
name = "greedy_engine"
required-features = ["metal"]

[[example]]
name = "dspark_engine"
required-features = ["metal"]

[[example]]
name = "resin_batch_ab"
required-features = ["metal"]

[[example]]
name = "resin_batch_baseline"
required-features = ["metal"]

[[example]]
name = "state_cache_cold"
required-features = ["cpu"]

[[example]]
name = "state_reuse_ab"
required-features = ["cpu"]

[[test]]
name = "suite"
path = "tests/suite.rs"

[[test]]
name = "minicpm_engine_parity"
path = "tests/minicpm_engine_parity.rs"
required-features = ["cpu"]
