[package]
autotests = false
name = "omni-rsi"
default-run = "omni-rsi"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
description = "Verified, idle-time chart reader adaptation for LFM3 Omni"

[features]
default = ["native", "metal", "training"]
native = ["dep:clap", "dep:ctrlc"]
training = ["burn/autodiff"]
wgpu = ["omni-lfm3/wgpu", "burn/wgpu", "burn/fusion"]
metal = ["wgpu", "omni-lfm3/metal", "burn/metal"]
cpu = ["omni-lfm3/cpu", "burn/ndarray"]

[dependencies]
omni-lfm3 = { path = "../lfm3-omni", default-features = false }
omni-r2t2 = { path = "../..", default-features = false, features = ["native"] }
burn = { version = "=0.21.0", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png"] }
hound = "3.5"
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.9"
tempfile = "3"
libc = "0.2"
clap = { version = "4.5", features = ["derive"], optional = true }
ctrlc = { version = "3.4", optional = true }

[dev-dependencies]
burn = { version = "=0.21.0", default-features = false, features = ["std", "autodiff"] }

[build-dependencies]
sha2 = "0.10"
libc = "0.2"

[[bin]]
name = "omni-rsi"
path = "src/main.rs"
required-features = ["native", "training"]

[[bin]]
name = "omni-rsi-audio"
path = "src/audio_main.rs"
required-features = ["native", "training"]

[[bin]]
name = "alimeeting-screen"
path = "src/bin/alimeeting-screen.rs"
required-features = ["native"]

[[test]]
name = "suite"
path = "tests/suite.rs"

[[test]]
name = "audio_backend_fingerprint"
path = "tests/audio_backend_fingerprint.rs"

[[test]]
name = "backend_production_context"
path = "tests/backend_production_context.rs"
