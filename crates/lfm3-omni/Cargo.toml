[package]
autotests = false
name = "omni-lfm3"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
description = "Local LFM3 Omni inference in Rust and Burn"

[features]
default = ["native", "metal"]
native = ["dep:clap", "dep:ctrlc"]
wgpu = ["burn/wgpu", "burn/fusion", "dep:burn-cubecl", "dep:cubecl"]
metal = ["wgpu", "burn/metal"]
cpu = ["burn/ndarray"]

[dependencies]
omni-r2t2 = { path = "../..", default-features = false, features = ["native"] }
burn = { version = "=0.21.0", default-features = false, features = ["std"] }
burn-cubecl = { version = "=0.21.0", default-features = false, features = ["std"], optional = true }
cubecl = { version = "=0.10.0", default-features = false, features = ["std", "wgpu"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
libc = "0.2"
unicode-normalization = "0.1"
minijinja = { version = "3.1", features = ["json", "preserve_order", "serde"] }
minijinja-contrib = { version = "3.1", features = ["pycompat"] }
clap = { version = "4.5", features = ["derive"], optional = true }
ctrlc = { version = "3.4", optional = true }
rand = "0.9"
hound = "3.5"
tempfile = "3"
rustfft = "6.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
burn = { version = "=0.21.0", default-features = false, features = ["std", "ndarray", "autodiff"] }

[[bin]]
name = "lfm3-omni"
path = "src/bin/lfm3-omni.rs"
required-features = ["native"]

[[test]]
name = "suite"
path = "tests/suite.rs"
