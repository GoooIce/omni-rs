[package]
name = "omni-breeze-tts"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
description = "Breeze-TTS-2 streaming inference in Rust and Burn"

[[example]]
name = "stream-bench"
required-features = ["metal"]

[[example]]
name = "batch-bench"
required-features = ["metal"]

[[example]]
name = "cache-verify"
required-features = ["metal"]

[workspace]

[features]
default = ["metal"]
metal = ["omni-r2t2/metal", "burn/metal", "burn/fusion", "burn/autotune", "dep:burn-cubecl", "dep:omni-kernel", "dep:cubecl"]
ane = ["omni-r2t2/ane", "metal", "burn/ane", "dep:burn-ane", "omni-kernel/ane"]
webgpu = ["burn/webgpu", "burn/fusion"]
cpu = ["burn/ndarray"]

[dependencies]
omni-kernel = { path = "../omni-kernel", optional = true }
omni-r2t2 = { path = "../..", default-features = false, features = ["native"] }
burn = { version = "=0.21.0", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
pollster = "0.4"
clap = { version = "4.5", features = ["derive"] }
hound = "3.5"
ctrlc = "3.4"
burn-cubecl = { version = "=0.21.0", default-features = false, features = ["std"], optional = true }
cubecl = { version = "=0.10.0", default-features = false, features = ["std", "stdlib"], optional = true }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
burn-ane = { path = "../burn-ane", features = ["metal-shared"], optional = true }

[dev-dependencies]
burn = { version = "=0.21.0", default-features = false, features = ["std", "ndarray"] }

[patch.crates-io]
burn-fusion = { path = "../../vendor/burn-fusion" }
cubecl-runtime = { path = "../../vendor/cubecl-runtime" }
cubecl-wgpu = { path = "../../vendor/cubecl-wgpu" }
burn-router = { path = "../../vendor/burn-router" }
burn = { path = "../../vendor/burn" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
