[package]
name = "omni-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
description = "Local HTTP adapters for Omni Burn inference"

[features]
default = ["metal"]
wgpu = ["omni-r2t2/wgpu", "burn/wgpu", "burn/fusion", "burn/autotune", "omni-hy-mt/wgpu", "omni-breeze-tts/wgpu", "omni-qwen-image/wgpu", "omni-music/wgpu", "omni-lfm3/wgpu"]
metal = ["wgpu", "omni-r2t2/metal", "burn/metal", "omni-hy-mt/metal", "omni-breeze-tts/metal", "omni-qwen-image/metal", "omni-music/metal", "omni-lfm3/metal"]
cpu = ["omni-r2t2/cpu", "burn/ndarray", "omni-hy-mt/cpu", "omni-breeze-tts/cpu", "omni-qwen-image/cpu", "omni-music/cpu", "omni-lfm3/cpu"]

[dependencies]
omni-lfm3 = { path = "../lfm3-omni", default-features = false }
base64 = "0.22"
omni-r2t2 = { path = "../..", default-features = false, features = ["native"] }
omni-hy-mt = { path = "../hy-mt", default-features = false, features = ["native"] }
omni-breeze-tts = { path = "../breeze-tts", default-features = false }
omni-qwen-image = { path = "../qwen-image", default-features = false }
omni-music = { path = "../omni-music", default-features = false }
burn = { version = "=0.21.0", default-features = false, features = ["std"] }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
pollster = "0.4"
hound = "3.5"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
