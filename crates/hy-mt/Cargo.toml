[package]
name = "omni-hy-mt"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
description = "Hy-MT2 translation in Rust/Burn with RadixAttention prefix reuse"

[workspace]

[features]
default = ["native", "metal"]
native = ["omni-r2t2/native", "dep:clap", "dep:pollster", "dep:ctrlc"]
metal = ["burn/metal", "burn/fusion", "burn/autotune", "dep:omni-kernel", "dep:cubecl", "dep:burn-cubecl"]
webgpu = ["burn/webgpu", "burn/fusion"]
cpu = ["burn/ndarray"]

[dependencies]
omni-r2t2 = { path = "../..", default-features = false }
burn = { version = "=0.21.0", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
clap = { version = "4.5", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }
ctrlc = { version = "3.4", optional = true }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
omni-kernel = { path = "../omni-kernel", optional = true }
cubecl = { version = "=0.10.0", default-features = false, features = ["std", "wgpu"], optional = true }
burn-cubecl = { version = "=0.21.0", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
burn = { version = "=0.21.0", default-features = false, features = ["std", "ndarray"] }
pollster = "0.4"

[[bin]]
name = "hy-mt"
path = "src/bin/hy-mt.rs"
required-features = ["native"]

[[example]]
name = "verify-reference"
required-features = ["native"]

[[example]]
name = "radix-bench"
required-features = ["native", "metal"]

[[example]]
name = "batch-bench"
required-features = ["native"]

[patch.crates-io]
cubecl-cpp = { path = "../../vendor/cubecl-cpp" }
burn-fusion = { path = "../../vendor/burn-fusion" }
cubecl-runtime = { path = "../../vendor/cubecl-runtime" }
cubecl-wgpu = { path = "../../vendor/cubecl-wgpu" }
burn-router = { path = "../../vendor/burn-router" }
burn = { path = "../../vendor/burn" }

[profile.release]
lto = "thin"
codegen-units = 16

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
