[package]
name = "resin-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Pure Rust scheduling and resource ownership for Resin"

[dependencies]
rkyv = { version = "0.8.18", default-features = false, features = ["std", "bytecheck", "unaligned", "little_endian", "pointer_width_32"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
prometheus-client = { version = "0.25.1", features = ["prometheus_protobuf", "protobuf-protox"] }
