name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Run all CPU checks
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python scripts/check.py cpu
      - name: Show check reports
        if: always()
        run: python scripts/check.py status
      - name: Preserve reports and step logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cpu-checks
          path: |
            artifacts/checks/**/*.json
            artifacts/checks/**/*.jsonl
            artifacts/checks/**/*.log
          retention-days: 14
